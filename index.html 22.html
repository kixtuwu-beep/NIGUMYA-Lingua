function ask(){A.innerHTML=`<div class="wrap c"><div class="card orn">${M(70)}<h2>Where should we start?</h2><button class="btn w" onclick="S.level='A1';S.view=1;sv();V='app';R()">I’m a complete beginner</button><button class="btn o w" onclick="PT={i:0,c:0,w:0};V='test';R()">Take a quick placement test</button></div></div>`}
function test(){const q=PTQ[PT.i];A.innerHTML=`<div class="wrap c"><div class="card orn"><div class="bar"><i style="width:${PT.i/6*100}%"></i></div><p class="mut">Question ${PT.i+1} of 6</p><h3>${q[0]}</h3>${q[1].map((o,i)=>`<button class="opt" onclick="ptA(${i})">${o}</button>`).join("")}</div></div>`}
function ptA(i){const q=PTQ[PT.i];if(i==q[2]){PT.c++;PT.w=0;sfx.ok()}else{PT.w++;sfx.bad()}PT.i++;if(PT.i>=6||PT.w>=2){const idx=PT.c>=6?5:Math.max(0,PT.c-1);S.level=LV[idx];S.placed=1;addXP(20);sv();chkBadges();const l=S.level;V="app";T="home";R();pop("Your level: "+l,LN[idx]+" · your path is unlocked")}else R()}
function app(){LT=LT||S.level;const nv=NAV[S.ui];document.documentElement.dataset.theme=S.theme||"";
const nav=`<nav>${["home","learn","practice","teachers","profile"].map((t,i)=>`<button class="${T==t?"on":""}" onclick="T='${t}';P=null;R();scrollTo(0,0)"><span>${["🏠","📚","🎯","👩‍🏫","👤"][i]}</span>${nv[i]}</button>`).join("")}</nav>`;
const bar=`<div class="row sp mut" style="margin-bottom:6px"><b style="color:var(--g2)">GUMYA Lingua</b><span class="row" style="gap:6px"><button class="btn o" style="padding:4px 10px" onclick="S.mute=!S.mute;sv();R()" aria-label="Mute">${S.mute?"🔇":"🔊"}</button><input type="range" min="0" max="1" step=".1" value="${vol}" style="width:70px" oninput="vol=+this.value" aria-label="Volume"><button class="btn o" style="padding:4px 10px" onclick="music()">${musicOn?"♪ On":"♪ Off"}</button></span></div>`;
A.innerHTML=nav+`<div class="wrap">${bar}${P?lesson():({home,learn,practice,teachers,profile}[T])()}</div>`}
function home(){const b=lessons(S.level).filter(n=>!isD(S.level,n)),wk=S.week,mx=Math.max(10,...wk),dn=S.tday===day()?S.today:0;
return `<div class="hd row">${M(84)}<div><h2>Salom, ${esc(S.name)}!</h2><div>${S.lang||"English"} · ${S.level} ${LN[lvI()]}</div><div>“Small steps every day. You’ve got this!”</div></div></div>
${S.xp==0?`<div class="ban">Daily reminder (demo banner): finish one lesson today to start your streak. Real push notifications need a backend.</div>`:""}
<div class="grid"><div class="card stat"><b>🔥 ${S.streak}</b>day streak</div><div class="card stat"><b>${S.xp}</b>total XP</div><div class="card stat"><b>${pct()}%</b>${S.level} complete</div><div class="card stat"><b>${Math.min(dn,S.goal)}/${S.goal}</b>daily goal XP</div></div>
<div class="card orn"><h3>${S.level} progress</h3><div class="bar"><i style="width:${pct()}%"></i></div>${b.length?`<button class="btn w" style="margin-top:12px" onclick="open_('${S.level}','${b[0]}')">Continue learning: ${b[0]}</button>`:"<p>Level complete! Explore the next level in Learn.</p>"}</div>
<div class="card"><h3>Recommended today</h3>${b.slice(0,3).map(n=>`<div class="les"><span>${n}</span><button class="btn o" ${unlocked(S.level,n)?"":"disabled"} onclick="open_('${S.level}','${n}')">Start</button></div>`).join("")||"All done!"}</div>
<div class="card"><h3>This week</h3><div class="row" style="align-items:flex-end;height:110px;justify-content:space-around">${wk.map((x,i)=>`<div class="stat mut"><div style="width:26px;height:${Math.max(4,x/mx*80)}px;background:linear-gradient(var(--g3),var(--g1));border-radius:6px 6px 0 0;margin:auto"></div>${"SMTWTFS"[i]}</div>`).join("")}</div></div>
<div class="card"><h3>Weekly challenge</h3><p class="mut">Earn 150 XP this week: ${wk.reduce((a,b)=>a+b,0)}/150 XP</p><div class="bar"><i style="width:${Math.min(100,wk.reduce((a,b)=>a+b,0)/1.5)}%"></i></div><h3 style="margin-top:14px">Leaderboard (demo)</h3>${[["Dilnoza",320],["Jasur",210],[S.name+" (you)",S.xp],["Sevara",90]].sort((a,b)=>b[1]-a[1]).map((r,i)=>`<div class="les"><span>${i+1}. ${esc(r[0])}</span><b>${r[1]} XP</b></div>`).join("")}</div>`}
function learn(){const cur=LT||S.level;return `<h2>Curriculum</h2><div class="tabs">${LV.map((l,i)=>`<button class="btn ${l==cur?"":"o"}" ${i>lvI()?"disabled":""} onclick="LT='${l}';R()">${i>lvI()?"🔒 ":""}${l}</button>`).join("")}</div><p class="mut">Levels above ${S.level} unlock when you finish the level before. Complete lessons in order.</p>
${UN[cur].map((u,ui)=>{const dn=u[1].filter(n=>isD(cur,n)).length;return `<div class="card orn"><div class="row sp"><h3>Unit ${ui+1}: ${u[0]}</h3><span class="tag">${dn==u[1].length?"Completed ✓":dn+"/"+u[1].length}</span></div><div class="bar"><i style="width:${dn/u[1].length*100}%"></i></div>${u[1].map(n=>{const d=isD(cur,n),u2=unlocked(cur,n);return `<div class="les ${u2?"":"lock"}"><span>${d?"✅":u2?"▶️":"🔒"} ${n}${LES[n]?"":" <span class='mut'>(quick review)</span>"}</span><button class="btn o" ${u2?"":"disabled"} onclick="open_('${cur}','${n}')">${d?"Redo":"Open"}</button></div>`}).join("")}</div>`}).join("")}
${cur==S.level&&pct()==100&&lvI()<5?`<button class="btn w" onclick="S.level='${LV[lvI()+1]}';LT=S.level;sv();pop('Level up!','Welcome to '+S.level);">Unlock ${LV[lvI()+1]}</button>`:""}`}
function open_(lv,n){T="learn";const q=(LES[n]||[...POOL].sort(()=>Math.random()-.5).slice(0,3));P={lv,n,q,i:0,r:0,a:null};R();scrollTo(0,0)}
function lesson(){const q=P.q[P.i],h=`<div class="row sp"><button class="btn o" onclick="P=null;R()">✕</button><div class="bar" style="flex:1"><i style="width:${P.i/P.q.length*100}%"></i></div></div>`;
let b=`<div class="card orn"><p class="mut">${P.n}</p><h3>${q[0]}</h3>`;
if(P.a===null){b+=q[1]?q[1].map((o,i)=>`<button class="opt" onclick="ans(${i})">${o}</button>`).join(""):`<input id="ti" placeholder="Type your answer" onkeydown="if(event.key=='Enter')ans()"><button class="btn w" onclick="ans()">Check</button>`}
else{if(q[1])b+=q[1].map((o,i)=>`<div class="opt ${i==q[2]?"ok":i==P.a?"no":""}">${o}</div>`).join("");b+=`<div class="fb ${P.good?"ok":"no"}"><b>${P.good?"Great job! 🎉":"Not quite."}</b> ${q[3]}${!P.good&&!q[1]?` Correct answer: <b>${q[2]}</b>`:""}</div><button class="btn w" onclick="nxt()">${P.i+1<P.q.length?"Continue":"Finish"}</button>`}
return h+b+`</div>`}
function ans(i){const q=P.q[P.i];let g;if(q[1]){g=i==q[2];P.a=i}else{const v=($("#ti").value||"").trim().toLowerCase().replace(/[.!?]$/,"").replace(/'/g,"’");if(!v)return;g=v==q[2];P.a=v}P.good=g;if(g){P.r++;sfx.ok();const c=A.firstChild;document.body.style.boxShadow="inset 0 0 60px rgba(50,163,107,.5)";setTimeout(()=>document.body.style.boxShadow="",350)}else{sfx.bad();S.miss[P.n]=(S.miss[P.n]||0)+1;sv()}R()}
function nxt(){P.i++;P.a=null;if(P.i<P.q.length)return R();const k=key(P.lv,P.n),first=!S.done.includes(k),xp=10+P.r*5;if(first)S.done.push(k);if(U)sb.from("lesson_progress").upsert({user_id:U,lesson_key:k,correct:P.r});addXP(xp);if(S.last!==day()){const y=new Date(Date.now()-864e5).toDateString();S.streak=S.last==y?S.streak+1:1;S.last=day()}sv();const n=P.n,r=P.r,t=P.q.length;P=null;chkBadges();R();pop("Lesson complete!",`${n}: ${r}/${t} correct · +${xp} XP`)}
function practice(){const tabs=[["skills","Skills"],["song","Songs"],["read","Read aloud"],["ai","AI Tutor"],["gram","Grammar"],["quiz","Quiz"]];return `<h2>Practice</h2><div class="tabs">${tabs.map(t=>`<button class="btn ${sub==t[0]?"":"o"}" onclick="sub='${t[0]}';R()">${t[1]}</button>`).join("")}</div>`+({skills,song:songv,read:readv,ai:aiv,gram:gramv,quiz:quizv}[sub])()}
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";speechSynthesis.speak(u)}catch(e){toast("Speech playback isn’t supported here.")}}
function skills(){return `<div class="card orn"><h3>🎧 Listening</h3><p class="mut">Press play, then answer.</p><button class="btn o" onclick="say('Hello, my name is Aziza. I am from Samarkand.')">▶ Play audio (browser voice)</button><p>Where is Aziza from?</p>${["Tashkent","Samarkand","Bukhara"].map((o,i)=>`<button class="opt" onclick="this.className='opt '+(${i}==1?'ok':'no');${i==1?"sfx.ok()":"sfx.bad()"}">${o}</button>`).join("")}</div>
<div class="card orn"><h3>📖 Reading</h3><p>Dilnoza gets up at 7. She drinks tea, then walks to school with her brother.</p><p>What does Dilnoza drink?</p>${["Milk","Tea","Juice"].map((o,i)=>`<button class="opt" onclick="this.className='opt '+(${i}==1?'ok':'no');${i==1?"sfx.ok()":"sfx.bad()"}">${o}</button>`).join("")}</div>
<div class="card orn"><h3>✍️ Writing with grammar check</h3><textarea id="wt" rows="3" placeholder="Write a sentence, e.g. i is a student"></textarea><button class="btn w" onclick="wc()">Check my writing</button><div id="wr"></div></div>
<div class="card orn"><h3>🎤 Speaking</h3><p class="mut">Use “Read aloud” for pronunciation practice with your microphone.</p></div>`}
function gram(t){const f=[];if(/\b(i|he|she|it)\s+(are)\b|\b(we|you|they)\s+is\b|\bi\s+is\b/i.test(t))f.push("Check the verb “to be”: I am, he/she/it is, we/you/they are.");if(/^[a-z]/.test(t))f.push("Start the sentence with a capital letter.");if(/\bi\b/.test(t))f.push("Write “I” as a capital letter.");if(!/[.!?]$/.test(t.trim()))f.push("End the sentence with punctuation.");if(/\b(a)\s+[aeiou]/i.test(t))f.push("Use “an” before a vowel sound: an apple.");return f}
function wc(){const t=$("#wt").value.trim();if(!t)return;const f=gram(t);$("#wr").innerHTML=f.length?`<div class="fb no">${f.map(x=>"• "+x).join("<br>")}</div>`:`<div class="fb ok">Looks correct! +5 XP</div>`;if(!f.length){addXP(5);sfx.ok()}else sfx.bad()}
function songv(){return `<div class="card orn"><h3>🎵 ${SONG.t}</h3><p class="mut">Karaoke mode with synchronised subtitles. Demo uses a synthesised melody; real songs need licensed audio.</p><button class="btn w" onclick="play()">▶ Play and sing</button><div id="kar">${SONG.l.map((l,i)=>`<div class="kl" id="k${i}">${l[0]}<div class="mut" style="font-size:14px">${l[1]}</div></div>`).join("")}</div></div>`}
function play(){SONG.l.forEach((l,i)=>{setTimeout(()=>{document.querySelectorAll(".kl").forEach(e=>e.classList.remove("on"));const e=$("#k"+i);if(e)e.classList.add("on");l[2].forEach((f,j)=>tone(f,.5,"triangle",j*.5,.25))},i*2200)});setTimeout(()=>{if(!S.song){S.song=1;addXP(15);chkBadges();toast("Song challenge complete! +15 XP")}},SONG.l.length*2200)}
function readv(){return `<div class="card orn"><h3>📖 Read aloud with AI feedback</h3><p id="rt" style="font-size:20px">${TXT.split(" ").map(w=>`<span class="w2">${w}</span>`).join(" ")}</p><button class="btn w" onclick="rec()">🎤 Start reading</button><p class="mut">Uses your browser’s speech recognition when available; otherwise a labelled demo score is shown. Production scoring needs a speech-AI service.</p></div>`}
function rec(){const R_=window.SpeechRecognition||window.webkitSpeechRecognition,ws=TXT.split(" ");const fin=heard=>{const hs=heard.toLowerCase().replace(/[^a-z\s]/g,"").split(/\s+/);let bad=0;const h=ws.map(w=>{const ok=hs.includes(w.toLowerCase().replace(/[^a-z]/g,""));if(!ok)bad++;return `<span class="w2 ${ok?"g":"x"}">${w}</span>`}).join(" ");$("#rt").innerHTML=h;const sc=Math.round(100*(ws.length-bad)/ws.length);toast(`Score ${sc}%${bad?" · tap red words to retry":" · Excellent!"}`);if(!S.read){S.read=1;addXP(15);chkBadges()}sv()};
if(!R_){toast("Microphone mode unsupported here: showing demo result");const d=ws.map(w=>w).join(" ").split(" ");const skip=ws[3];return fin(TXT.replace(skip,""))}
try{const r=new R_();r.lang="en-US";r.onresult=e=>fin(e.results[0][0].transcript);r.onerror=()=>toast("Microphone unavailable or permission denied.");r.start();toast("Listening… read the text aloud")}catch(e){toast("Microphone unavailable.")}}
let CH=[["a","Hi, I’m your AI tutor. Ask about grammar, or type a sentence to correct. (Rule-based demo; a real tutor needs an AI backend.)"]];
function aiv(){return `<div class="card orn"><div class="row">${M(50)}<h3>AI Tutor</h3></div><div class="chat" id="ch">${CH.map(m=>`<div class="m ${m[0]}">${m[1]}</div>`).join("")}</div><input id="ci" placeholder="Ask or type a sentence" onkeydown="if(event.key=='Enter')ai()"><button class="btn w" onclick="ai()">Send</button><div class="row">${["Explain verb to be","Give me vocabulary","What should I study?"].map(t=>`<button class="btn o" onclick="$('#ci').value='${t}';ai()">${t}</button>`).join("")}</div></div>`}
function ai(){const t=$("#ci").value.trim();if(!t)return;let r;const l=t.toLowerCase();
if(/to be|verb/.test(l))r="“To be” changes with the subject: I <b>am</b>, you/we/they <b>are</b>, he/she/it <b>is</b>.";
else if(/vocab|word/.test(l)){const w=[["bread","non"],["river","daryo"],["friend","doʻst"]];w.forEach(x=>{if(!S.words.find(y=>y.w==x[0]))S.words.push({w:x[0],t:x[1],box:0,due:0})});sv();syncW();r="Added to your notebook: bread (non), river (daryo), friend (doʻst). Review them in Profile.";}
else if(/study|recommend|lesson/.test(l)){const m=Object.entries(S.miss).sort((a,b)=>b[1]-a[1])[0];r=m?`You missed most questions in <b>${m[0]}</b>. Try that lesson again.`:"No mistakes yet! Continue with your next lesson in Learn."}
else if(/^(hi|hello|salom)/.test(l))r="Salom! What would you like to practise?";
else{const f=gram(t);r=f.length?"Corrections:<br>"+f.map(x=>"• "+x).join("<br>"):"That sentence looks good! Want a harder challenge?"}
CH.push(["u",esc(t)],["a",r]);R();const c=$("#ch");if(c)c.scrollTop=1e5}
function teachers(){return `<h2>Meet Your Teachers</h2><p class="mut">Demonstration profiles only. They are not real UzGUMYA professors.</p>${TCH.map((t,i)=>`<div class="card orn"><div class="row"><div class="av">${t[0][0]}</div><div><b>${t[0]}</b> <span class="tag">Demo profile</span><div class="mut">${t[1]} · ${t[2]}</div><div>⭐ ${t[4]}</div></div></div><p>${t[3]}</p><p class="mut">“Great explanations, very patient.” — demo student feedback</p><button class="btn o" id="bk${i}" onclick="this.textContent='Requested (demo) ✓';this.disabled=true">Book consultation</button></div>`).join("")}<div class="card orn"><h3>Submit a written assignment</h3><textarea id="as" rows="4" placeholder="Paste your paragraph or essay"></textarea><button class="btn w" onclick="subm()">Send for feedback</button>${S.sub.map(s=>`<div class="les"><span>${esc(s.slice(0,40))}…</span><span class="tag">Awaiting teacher (demo)</span></div>`).join("")}<p class="mut">Real teacher feedback needs a backend.</p></div>`}
function subm(){const t=$("#as").value.trim();if(!t)return;S.sub.push(t);if(U)sb.from("submissions").insert({user_id:U,body:t});sv();R()}
function profile(){const due=S.words.filter(w=>w.due<=Date.now());return `<div class="hd row"><div class="av" style="width:70px;height:70px">${M(60)}</div><div><h2>${esc(S.name)}</h2><div>${esc(S.email)}</div><div>${S.lang} · ${S.level} ${LN[lvI()]}</div></div></div>
<div class="grid"><div class="card stat"><b>${S.xp}</b>XP</div><div class="card stat"><b>🔥 ${S.streak}</b>streak</div><div class="card stat"><b>${S.done.length}</b>lessons done</div><div class="card stat"><b>${S.week.reduce((a,b)=>a+b,0)}</b>XP this week</div></div>
<div class="card orn"><h3>Badges</h3><div class="grid">${BG.map(b=>`<div class="stat"><div class="med ${S.badges.includes(b[0])?"":"off"}">${b[1]}</div><small>${b[0]}</small></div>`).join("")}</div></div>
<div class="card orn"><h3>Vocabulary notebook</h3><div class="row"><input id="vw" placeholder="Word" style="flex:1"><input id="vt" placeholder="Translation" style="flex:1"><button class="btn" onclick="addW()">Add</button></div><button class="btn o" onclick="addPack()">+ Add starter word pack (8 words)</button>${S.words.map(w=>`<div class="les"><span>${esc(w.w)} — ${esc(w.t)}</span><span class="tag">box ${w.box+1}</span></div>`).join("")||"<p class='mut'>No words yet.</p>"}
${due.length?`<div class="card" style="background:var(--mint)"><b>Review: ${esc(due[0].w)}</b> <button class="btn o" onclick="rv(0)">Remembered</button> <button class="btn o" onclick="rv(1)">Forgot</button><p class="mut">Spaced repetition: remembered words return after 1, 2, 4, then 8 days.</p></div>`:"<p class='mut'>Nothing due for review.</p>"}</div>
<div class="card orn"><h3>Settings</h3><div class="row"><button class="btn o" onclick="S.theme=document.documentElement.dataset.theme=='dark'?'light':'dark';sv();R()">🌙 Dark mode</button>${["en","uz","ru"].map(l=>`<button class="btn ${S.ui==l?"":"o"}" onclick="S.ui='${l}';sv();R()">${l.toUpperCase()}</button>`).join("")}</div><p class="mut">Downloadable PDF notes and push notifications need future integration.</p><button class="btn o" onclick="out()">Log out</button> <button class="btn o" onclick="if(confirm('Reset all progress?')){S.xp=0;S.done=[];S.streak=0;S.badges=[];S.week=[0,0,0,0,0,0,0];if(U){sb.from("lesson_progress").delete().eq("user_id",U);sb.from("achievements").delete().eq("user_id",U)}sv();R()}">Reset progress</button></div>`}
function addW(){const w=$("#vw").value.trim(),t=$("#vt").value.trim();if(!w)return;S.words.push({w,t,box:0,due:0});sv();syncW();R()}
function rv(f){const w=S.words.filter(w=>w.due<=Date.now())[0];w.box=f?0:Math.min(w.box+1,3);w.due=Date.now()+[1,2,4,8][w.box]*864e5;if(!f){addXP(2);sfx.ok()}else sfx.bad();sv();syncW();R()}
const GR=[["Verb To Be","I am · you/we/they are · he/she/it is.","She ___ a teacher.",["is","are"],0],["Articles","Use “a” before consonant sounds and “an” before vowel sounds.","I eat ___ apple.",["a","an"],1],["Plural nouns","Add -s. Words ending in consonant + y change to -ies.","Two ___ (city)",["citys","cities"],1]];
function gramv(){return GR.map((g,i)=>`<div class="card orn"><h3>${g[0]}</h3><p>${g[1]}</p><p><b>${g[2]}</b> ${S.gr.includes(g[0])?"✅":""}</p>${g[3].map((o,j)=>`<button class="opt" onclick="gA(${i},${j},this)">${o}</button>`).join("")}</div>`).join("")}
function gA(i,j,b){const g=GR[i],ok=j==g[4];b.className="opt "+(ok?"ok":"no");if(ok){sfx.ok();if(!S.gr.includes(g[0])){S.gr.push(g[0]);addXP(5,"grammar");sv();toast("+5 XP")}}else{sfx.bad();toast("Not quite. Rule: "+g[1])}}
function quizv(){return `<div class="card orn"><h3>🧠 Mixed quiz</h3><p>5 random questions from all lessons. Earn XP for every correct answer.</p><button class="btn w" onclick="quiz()">Start quiz</button></div>`}
function quiz(){P={lv:"Quiz",n:"Mixed Quiz",q:[...POOL].sort(()=>Math.random()-.5).slice(0,5),i:0,r:0,a:null};R()}
const PACK=[["book","kitob"],["water","suv"],["house","uy"],["teacher","oʻqituvchi"],["morning","tong"],["family","oila"],["city","shahar"],["happy","xursand"]];
function addPack(){PACK.forEach(x=>{if(!S.words.find(y=>y.w==x[0]))S.words.push({w:x[0],t:x[1],box:0,due:0})});sv();syncW();R()}
boot();
</script></body></html>
